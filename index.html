<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>alc_log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="app-header" class="hidden">
    <h1 class="logo">alc_log</h1>
    <button id="btn-logout" class="text-btn">ログアウト</button>
  </header>

  <main id="app">
    <section id="view-login" class="view">
      <div class="login-container">
        <div class="login-logo">
          <h1>alc_log</h1>
          <p>あなたの特別なお酒の記憶を。</p>
        </div>

        <div class="form-group">
          <label for="input-username">ユーザー名</label>
          <input type="text" id="input-username" placeholder="例: Taro" autocomplete="username" maxlength="40">
        </div>

        <div class="form-group">
          <label for="input-password">パスワード</label>
          <input type="password" id="input-password" placeholder="10文字以上" autocomplete="current-password" maxlength="200">
        </div>

        <button id="btn-login" class="btn-primary">ログイン</button>
        <button id="btn-show-register" class="text-btn login-register-toggle">初回登録はこちら</button>

        <div id="registration-panel" class="registration-panel hidden">
          <div class="form-group">
            <label for="input-registration-code">登録コード</label>
            <input type="password" id="input-registration-code" placeholder="管理者から渡されたコード" autocomplete="off" maxlength="100">
            <p class="login-help">登録コードはGitHubには保存せず、管理者から直接受け取ってください。</p>
          </div>
          <button id="btn-register" class="btn-secondary">新規登録</button>
        </div>
      </div>
    </section>

    <section id="view-list" class="view hidden">
      <div class="filters">
        <select id="filter-category">
          <option value="all">すべてのカテゴリ</option>
          <option value="日本酒">日本酒</option>
          <option value="ウィスキー">ウィスキー</option>
          <option value="ワイン">ワイン</option>
          <option value="ビール">ビール</option>
          <option value="焼酎">焼酎</option>
          <option value="チューハイ">チューハイ</option>
          <option value="カクテル">カクテル</option>
          <option value="その他">その他</option>
        </select>
        <select id="filter-rating">
          <option value="all">すべての評価</option>
          <option value="5">★★★★★</option>
          <option value="4">★★★★☆</option>
          <option value="3">★★★☆☆</option>
          <option value="2">★★☆☆☆</option>
          <option value="1">★☆☆☆☆</option>
        </select>
        <select id="filter-location">
          <option value="all">すべての場所</option>
          <option value="レストラン">レストラン</option>
          <option value="バー">バー</option>
          <option value="居酒屋">居酒屋</option>
          <option value="蒸留所">蒸留所</option>
          <option value="酒蔵">酒蔵</option>
          <option value="家">家</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div id="list-container" class="list-container"></div>
      <button id="btn-add" class="fab" aria-label="記録を追加">+</button>
    </section>

    <section id="view-form" class="view hidden">
      <div class="view-header">
        <button class="icon-btn btn-back">← 戻る</button>
        <h2 id="form-title">記録の追加</h2>
        <div class="header-spacer"></div>
      </div>

      <div class="form-container">
        <input type="hidden" id="form-id">

        <div class="form-group">
          <label for="form-name">お酒の名前 <span class="required">*</span></label>
          <input type="text" id="form-name" placeholder="銘柄などを入力" maxlength="120" required>
        </div>

        <div class="form-group">
          <label for="form-date">飲んだ日付</label>
          <input type="date" id="form-date">
        </div>

        <div class="form-group">
          <label>評価</label>
          <div class="star-rating" id="form-rating-stars" role="radiogroup" aria-label="評価">
            <span data-val="1">★</span><span data-val="2">★</span><span data-val="3">★</span><span data-val="4">★</span><span data-val="5">★</span>
          </div>
          <input type="hidden" id="form-rating" value="0">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-category">カテゴリ</label>
            <select id="form-category">
              <option value="">選択してください</option>
              <option value="日本酒">日本酒</option>
              <option value="ウィスキー">ウィスキー</option>
              <option value="ワイン">ワイン</option>
              <option value="ビール">ビール</option>
              <option value="焼酎">焼酎</option>
              <option value="チューハイ">チューハイ</option>
              <option value="カクテル">カクテル</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="form-location">場所</label>
            <select id="form-location">
              <option value="">選択してください</option>
              <option value="レストラン">レストラン</option>
              <option value="バー">バー</option>
              <option value="居酒屋">居酒屋</option>
              <option value="蒸留所">蒸留所</option>
              <option value="酒蔵">酒蔵</option>
              <option value="家">家</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="form-comment">一言コメント</label>
          <textarea id="form-comment" rows="4" placeholder="香りや味の感想、一緒に食べたものなど" maxlength="3000"></textarea>
        </div>

        <button id="btn-save" class="btn-primary form-save-button">保存する</button>
      </div>
    </section>

    <section id="view-detail" class="view hidden">
      <div class="view-header">
        <button class="icon-btn btn-back">← 戻る</button>
        <h2>詳細情報</h2>
        <div class="header-spacer"></div>
      </div>

      <div class="detail-container">
        <div class="detail-card">
          <div class="detail-header">
            <span id="detail-category" class="tag"></span>
            <span id="detail-date" class="date-text"></span>
          </div>
          <h2 id="detail-name" class="detail-title"></h2>
          <div id="detail-rating" class="stars"></div>

          <div class="detail-row">
            <span class="detail-label">場所:</span>
            <span id="detail-location"></span>
          </div>

          <div class="detail-comment-box">
            <p id="detail-comment"></p>
          </div>
        </div>

        <button id="btn-edit" class="btn-secondary">内容を修正する</button>
      </div>
    </section>
  </main>

  <div id="loading" class="hidden" aria-live="polite" aria-busy="true">
    <div class="spinner"></div>
    <p>通信中...</p>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
